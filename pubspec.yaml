name: chronoplan
description: Hourly time-tracking and productivity analysis app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Backend
  supabase_flutter: ^2.6.0

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Charts
  fl_chart: ^0.69.0

  # HTTP / AI
  http: ^1.2.1

  # UI & Typography
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.0
  go_router: ^14.2.7
  shared_preferences: ^2.5.5
  flutter_slidable: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  riverpod_lint: ^2.3.13
  custom_lint: ^0.7.0
  sqlite3: ^2.9.4

flutter:
  uses-material-design: true
